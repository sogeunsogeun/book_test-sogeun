<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소근소근 독서 취향 테스트</title>
    <style>
        :root {
            --bg-color: #fdf8eb;
            --main-green: #0b663b;
            --accent-green: #148f52;
            --light-green: #eaf5ee;
            --text-dark: #2c3e50;
            --text-muted: #5a6c7d;
            --white: #ffffff;
            --card-shadow: 0 8px 24px rgba(11, 102, 59, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: var(--card-shadow);
            border: 2px solid var(--light-green);
            text-align: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--main-green);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        .main-img {
            margin: 20px 0 30px 0;
        }
        
        .main-img img {
            display: inline-block;
            vertical-align: middle;
        }

        .btn {
            background-color: var(--main-green);
            color: var(--white);
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(11, 102, 59, 0.2);
        }

        .btn:hover {
            background-color: var(--accent-green);
            transform: translateY(-2px);
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--light-green);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--main-green);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .q-number {
            color: var(--main-green);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: var(--white);
            color: var(--text-dark);
            border: 2px solid var(--light-green);
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            line-height: 1.3;
        }

        .option-btn:hover {
            background-color: var(--light-green);
            border-color: var(--main-green);
            color: var(--main-green);
            padding-left: 24px;
        }

        .result-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .result-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--main-green);
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .result-desc {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-dark);
            margin-bottom: 30px;
            text-align: left;
            background: var(--bg-color);
            padding: 20px;
            border-radius: 16px;
            word-break: keep-all;
            white-space: pre-line;
        }

        .book-section-title {
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            margin-bottom: 12px;
            color: var(--main-green);
            border-left: 4px solid var(--main-green);
            padding-left: 8px;
        }

        .book-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .book-card {
            background: var(--white);
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .book-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            background: var(--light-green);
            color: var(--main-green);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .book-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .book-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .restart-btn {
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 30px 20px; border-radius: 20px; }
            h1 { font-size: 24px; }
            .q-text { font-size: 18px; }
            .option-btn { font-size: 14px; padding: 14px 16px; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="start-screen" class="screen active">
            <div class="main-img">
                <img src="logo.png" alt="소근소근 로고" style="width: 260px; height: auto;">
            </div>
            <h1>소근소근<br>독서 취향 테스트</h1>
            <p class="subtitle">나도 모르는 나의 숨겨진 독서 성향과<br>내 마음에 쏙 맞춘 인생 책 찾기</p>
            <button class="btn" onclick="startTest()">테스트 시작하기</button>
        </div>

        <div id="question-screen" class="screen">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="q-number" class="q-number">Question 1 / 15</div>
            <div id="q-text" class="q-text">질문 텍스트</div>
            <div id="options" class="options-list"></div>
        </div>

        <div id="result-screen" class="screen">
            <div class="result-title">당신의 독서 취향은?</div>
            <div id="result-name" class="result-name">유형 이름 조합</div>
            <div id="result-desc" class="result-desc">유형 설명</div>
            
            <div class="book-section-title">당신을 위한 맞춤 도서 추천</div>
            <div id="book-list" class="book-list"></div>

            <button class="btn restart-btn" onclick="restartTest()">테스트 다시하기</button>
        </div>

    </div>

    <script>
        // 🌟 15가지 프리미엄 수학적 밸런스 질문지
        const questions = [
            {
                q: "주말 저녁, 넷플릭스를 켰을 때 가장 먼저 눈길이 가는 썸네일은?",
                options: [
                    { text: "피가 거꾸로 솟는 범죄 현장이나 탈출극", type: "A" },
                    { text: "보기만 해도 심장이 간질간질해지는 하이틴 로맨스", type: "B" },
                    { text: "시각 효과가 압도적인 우주 전쟁이나 마법 세계", type: "C" },
                    { text: "가볍고 귀여운 그림체의 애니메이션이나 웹툰 원작", type: "G" }
                ]
            },
            {
                q: "서점에 들어섰을 때, 발걸음이 가장 오래 머무는 공간은?",
                options: [
                    { text: "마음을 울리는 문구가 적힌 잔잔한 매대", type: "D" },
                    { text: "주식, 부동산, 트렌드 분석이 깔린 신간 코너", type: "E" },
                    { text: "두꺼운 역사서와 인류의 기원이 적힌 깊숙한 코너", type: "F" },
                    { text: "소설 코너 중에서도 반전 플롯이 숨겨진 매대", type: "A" }
                ]
            },
            {
                q: "친구가 '나 요즘 너무 번아웃 온 것 같아...'라며 한숨 쉴 때 내 반응은?",
                options: [
                    { text: "'나도 그랬는데, 이 한 줄 읽고 울컥했어' 가슴 따뜻한 글귀를 보낸다", type: "D" },
                    { text: "'생산성이 떨어졌구나. 이직이나 부업 트렌드를 알아볼까?' 해결책을 준다", type: "E" },
                    { text: "'다 잊고 대리 설렘 가득한 로맨스 소설이나 보면서 기분 전환하자!'", type: "B" },
                    { text: "'복잡한 거 보지 말고, 가볍게 피식 웃을 수 있는 웹툰 정주행 고?'", type: "G" }
                ]
            },
            {
                q: "만약 나에게 타임머신이 생겨 딱 한 번 이동할 수 있다면?",
                options: [
                    { text: "미래의 초고도 과학 기술 도시로 날아가 보기", type: "C" },
                    { text: "고대 로마나 조선 시대로 가서 역사적 진실을 목격하기", type: "F" },
                    { text: "10년 전으로 돌아가 유망한 주식이나 비트코인 사두기", type: "E" },
                    { text: "내가 좋아하는 만화나 웹툰 속 세계관으로 빙의하기", type: "G" }
                ]
            },
            {
                q: "친구들과의 대화 중 내가 가장 흥미롭게 듣는 주제는?",
                options: [
                    { text: "요즘 세상 돌아가는 경제 흐름과 성공한 사람들의 재테크 비법", type: "E" },
                    { text: "최근 화제가 된 미제 사건이나 소름 돋는 범죄 심리 이야기", type: "A" },
                    { text: "인간의 심리, 철학, 또는 흥미진진한 세계사 비화", type: "F" },
                    { text: "사랑, 연애, 혹은 사람 관계에서 오는 말랑말랑한 감정 이야기", type: "B" }
                ]
            },
            {
                q: "가방 속에 책을 딱 한 권만 넣고 다녀야 한다면, 어떤 책이 좋을까?",
                options: [
                    { text: "아무 페이지나 펼쳐서 가볍게 읽고 위로받을 수 있는 책", type: "D" },
                    { text: "한 번 펼치면 범인이 궁금해서 중간에 절대 못 덮는 책", type: "A" },
                    { text: "두께는 얇지만 캐릭터와 연출이 화려해 눈이 즐거운 책", type: "G" },
                    { text: "비현실적인 설정으로 머릿속을 신선한 자극으로 채워주는 책", type: "C" }
                ]
            },
            {
                q: "내가 세상을 바라볼 때 가장 중요하게 생각하는 관점은?",
                options: [
                    { text: "인간의 감정과 따뜻한 소통, 그리고 자아 성찰", type: "D" },
                    { text: "철저한 데이터, 트렌드, 그리고 실질적인 자산의 성장", type: "E" },
                    { text: "과거로부터 배우는 교훈, 그리고 인간 사회에 대한 깊은 통찰", type: "F" },
                    { text: "현실의 제약을 뛰어넘는 무한한 상상력과 가능성", type: "C" }
                ]
            },
            {
                q: "일상에 지쳐 무작정 낯선 곳으로 혼자 여행을 떠난 당신, 숙소에서 하고 싶은 것은?",
                options: [
                    { text: "밤바다 소리를 들으며 다정한 문장들을 다이어리에 꾹꾹 눌러 쓰기", type: "D" },
                    { text: "침대에 누워 이불을 뒤집어쓰고 아껴둔 로맨스 소설 정주행하기", type: "B" },
                    { text: "낯선 동네의 오래된 박물관이나 유적지 찾아가 탐방하기", type: "F" },
                    { text: "블루투스 스피커를 크게 틀어놓고 웅장한 SF 영화 한 편 때리기", type: "C" }
                ]
            },
            {
                q: "내가 생각하는 '인생 명작'의 기준은 무엇인가요?",
                options: [
                    { text: "마지막 장을 덮었을 때 온몸에 소름이 돋는 충격적인 반전", type: "A" },
                    { text: "오랜 시간이 지나도 가슴에 깊은 여운과 뭉클함을 남기는 감정", type: "B" },
                    { text: "상상도 못 한 거대한 세계관과 독창적인 설정", type: "C" },
                    { text: "내 삶의 방향성을 완전히 바꿔놓은 현실적인 지혜와 배움", type: "E" }
                ]
            },
            {
                q: "만약 내가 직접 글을 쓰는 작가가 된다면 도전해보고 싶은 분야는?",
                options: [
                    { text: "치밀한 복선과 떡밥을 깔아두는 천재 미스터리 작가", type: "A" },
                    { text: "글로 사람들의 마음에 따뜻한 반창고를 붙여주는 치유 에세이 작가", type: "D" },
                    { text: "글보단 그림과 재치 있는 대사로 독자들을 몰입시키는 만화가", type: "G" },
                    { text: "철저한 고증을 바탕으로 시대를 재조명하는 역사 인문학자", type: "F" }
                ]
            },
            {
                q: "지인에게 책을 선물하려고 합니다. 어떤 책을 고르시겠습니까?",
                options: [
                    { text: "트렌디하고 실용적이어서 당장 삶에 도움이 되는 경제 가이드북", type: "E" },
                    { text: "연애 세포를 깨워주거나 인간관계의 다정함을 담은 소설", type: "B" },
                    { text: "남녀노소 호불호 없이 10분 만에 몰입해서 웃으며 읽을 수 있는 만화책", type: "G" },
                    { text: "밤새도록 지적 쾌감을 채워줄 수 있는 흥미진진한 교양 도서", type: "F" }
                ]
            },
            {
                q: "갑자기 일주일 동안 스마트폰과 인터넷이 전면 차단된다면?",
                options: [
                    { text: "오히려 좋아! 그동안 밀린 초자연적·미스터리 장편 소설을 쌓아두고 읽는다", type: "A" },
                    { text: "나 자신을 되돌아보며 조용히 사색하고 아날로그 감성을 즐긴다", type: "D" },
                    { text: "우주나 이세계로 떠나는 판타지 만화책을 전권 대여해 와서 방방 뒹굴며 본다", type: "G" },
                    { text: "미래 사회를 대비하기 위해 최신 종이 신문과 트렌드 서적을 정독한다", type: "E" }
                ]
            },
            {
                q: "친구가 깜짝 선물로 전시회 티켓을 주었습니다. 어떤 전시회였으면 좋겠나요?",
                options: [
                    { text: "유명 만화가/웹툰 작가의 비하인드 스케치 및 굿즈 전시회", type: "G" },
                    { text: "고대 이집트 미라나 가려진 역사적 유물을 보여주는 기획전", type: "F" },
                    { text: "몽환적인 미디어 아트로 우주 한가운데 서 있는 듯한 체험전", type: "C" },
                    { text: "연인들의 사랑과 애틋한 스토리를 담은 감성 사진전", type: "B" }
                ]
            },
            {
                q: "드라마나 웹툰을 볼 때 내가 가장 참을 수 없는 답답한 상황은?",
                options: [
                    { text: "주인공들의 오해 때문에 로맨스 진도가 안 나가고 고구마 먹을 때", type: "B" },
                    { text: "사건의 범인이 누군지 뻔히 보이는데 주인공만 삽질하고 있을 때", type: "A" },
                    { text: "감정에만 호소하고 현실적인 대안이나 논리적 팩트가 전혀 없을 때", type: "E" },
                    { text: "뻔한 클리셰만 남발하고 신선한 상상력이나 설정이 전혀 없을 때", type: "C" }
                ]
            },
            {
                q: "마지막 질문입니다. 오늘 밤, 당신의 침대 머리맡에 두고 싶은 책의 표지 느낌은?",
                options: [
                    { text: "어둡고 강렬하여 비밀을 감추고 있는 듯한 표지", type: "A" },
                    { text: "파스텔톤의 따뜻하고 감성적인 일러스트가 그려진 표지", type: "D" },
                    { text: "화려하고 우주적이거나 신비로운 그래픽이 들어간 표지", type: "C" },
                    { text: "제목이 큼직하고 깔끔하여 신뢰감을 주는 타이포그래피 표지", type: "E" }
                ]
            }
        ];

        // 🌟 완벽한 140권 하이브리드 크로스오버 도서 풀 (25권씩 x 7개 장르)
        const categoryDetails = {
            "A": {
                name: "스릴만점 프로 추적러",
                desc: "당신은 지루할 틈 없는 빠른 전개와 심장을 쫄깃하게 만드는 사건 중심의 소설을 좋아합니다.",
                books: [
                    // 스테디셀러 15권

                    { title: "드래곤볼", desc: "전 세계를 상상력의 스케일로 압도한 모험 판타지 만화의 전설이자 뿌리.", crossover: "C" },
                    { title: "원피스", desc: "동료들과 함께 대비보를 찾아 바다로 떠나는 거대한 해적 판타지 대서사시.", crossover: "C" },
                    { title: "명탐정 코난", desc: "몸은 작아졌어도 두뇌는 그대로! 치밀한 트릭을 풀어내는 추리 만화의 황제.", crossover: "A" },
                    { title: "몬스터", desc: "살려낸 천재 사이코패스를 추적하며 인간의 선과 악의 경계를 묻는 스릴러 만화의 신화.", crossover: "A" },
                    { title: "식객", desc: "전국 팔도의 귀한 음식과 그 속에 담긴 사람들의 눈물겨운 감동 인생 에세이 만화.", crossover: "D" },
                    { title: "강철의 연금술사", desc: "등가교환의 법칙 아래 잃어버린 몸을 찾으려는 형제의 철학적 정통 판타지 만화.", crossover: "C" },
                    { title: "데스노트", desc: "이름을 적으면 죽는 노트를 둘러싼 두 천재의 숨 막히는 서스펜스 두뇌 싸움 만화.", crossover: "A" },
                    { title: "바람의 검심", desc: "메이지 유신 시대를 배경으로 칼잡이 발도재가 펼치는 참회와 검술 역사 만화.", crossover: "F" },
                    { title: "H2 (에이치투)", desc: "고교 야구를 배경으로 펼쳐지는 네 청춘의 풋풋하고도 아련한 엇갈림 로맨스 만화.", crossover: "B" },
                    { title: "핑퐁", desc: "탁구에 인생을 건 천재와 수재의 고독한 사투를 독창적인 연출로 그려낸 예술 만화.", crossover: "D" },
                    { title: "신의 물방울", desc: "와인 한 방울 속에 담긴 대자연의 서사와 인생을 찾아가는 지적 교양 만화.", crossover: "E" },
                    { title: "기생수", desc: "인간의 뇌를 점령한 외계 생명체와 한 소년의 기이한 공존과 생존 SF 만화.", crossover: "C" },
                    { title: "심야식당", desc: "밤 12시에 문을 여는 이색 식당에서 손님들이 나누는 다정하고 쓸쓸한 인생 공감 만화.", crossover: "D" },
                    { title: "베르세르크", desc: "거대한 대검을 들고 가혹한 운명과 마수들에 맞서 싸우는 다크 판타지의 정점.", crossover: "C" },
                    // 최신 베스트셀러 10권 (2016~2026)
                    { title: "미생 전권", desc: "바둑판 같던 직장 생활 속에서 살아남으려는 인턴들의 리얼한 경영 생존 교과서 웹툰.", crossover: "E" },
                    { title: "신과함께", desc: "저승 법에 따라 사후 49일 동안 펼쳐지는 7번의 재판을 그린 한국 신화 판타지 웹툰.", crossover: "F" },
                    { title: "이태원 클라쓰", desc: "불합리한 세상 속, 고집과 객기로 뭉친 청춘들의 이태원 창업 신화 복수극 웹툰.", crossover: "E" },
                    { title: "유미의 세포들", desc: "머릿속 세포들의 앙증맞은 연출을 통해 삼십대 여성의 현실 연애와 심리를 그린 로맨스 웹툰.", crossover: "B" },
                    { title: "귀멸의 칼날", desc: "도깨비가 된 여동생을 인간으로 되돌리기 위한 혈풍검극 판타지 만화의 메가 히트작.", crossover: "C" },
                    { title: "나 혼자만 레벨업", desc: "인류 최약체 헌터가 전 세계를 제패하는 최강의 존재로 거듭나는 먼치킨 카타르시스 웹툰.", crossover: "C" },
                    { title: "타인의 지옥이다", desc: "낯선 고시원 생활 속에서 이웃들이 선사하는 숨 막히는 사이코패스 스릴러 공포 웹툰.", crossover: "A" },
                    { title: "삼국지톡", desc: "조조, 유비, 손권이 스마트폰을 쓴다면? 삼국지 역사를 트렌디하게 재해석한 인기 웹툰.", crossover: "F" },
                    { title: "정년이", desc: "150년대 국극단을 배경으로 소리 천재 소녀들의 뜨거운 우정과 라이벌 성장을 다룬 역사 웹툰.", crossover: "F" },
                    { title: "송곳", desc: "대형마트의 부당해고에 맞서 법과 노동의 가치를 치열하게 배우는 하이퍼리얼리즘 웹툰.", crossover: "E" }
                ]
            }
        };

        let currentQuestionIndex = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 };

        function startTest() {
            document.getElementById("start-screen").classList.remove("active");
            document.getElementById("question-screen").classList.add("active");
            currentQuestionIndex = 0;
            scores = { A: 0, B: 0, C: 0, D: 0, E: 0, F: 0, G: 0 };
            showQuestion();
        }

        function showQuestion() {
            const qData = questions[currentQuestionIndex];
            
            document.getElementById("q-number").innerText = `Question ${currentQuestionIndex + 1} / 15`;
            document.getElementById("q-text").innerText = qData.q;
            
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            document.getElementById("progress-bar").style.width = `${progressPercent}%`;

            const optionsContainer = document.getElementById("options");
            optionsContainer.innerHTML = "";
            
            qData.options.forEach(option => {
                const button = document.createElement("button");
                button.className = "option-btn";
                button.innerText = option.text;
                button.onclick = () => selectOption(option.type);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                document.getElementById("progress-bar").style.width = "100%";
                setTimeout(showResult, 200);
            }
        }

        // 피셔-예이츠 완벽 셔플 알고리즘
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showResult() {
            document.getElementById("question-screen").classList.remove("active");
            document.getElementById("result-screen").classList.add("active");

            // 🌟 [동점 정밀 처리] 정렬 전 카테고리 기호 자체를 먼저 완전히 섞음으로써 동점자 편향 완벽 해결
            let baseCategories = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
            baseCategories = shuffle(baseCategories);
            const sortedTypes = baseCategories.sort((a, b) => scores[b] - scores[a]);
            
            const top1 = sortedTypes[0];
            const top2 = sortedTypes[1];

            const nameMap = {
                "A": "추리/스릴러",
                "B": "로맨스",
                "C": "판타지/SF",
                "D": "에세이/시",
                "E": "경제/경영",
                "F": "인문/역사",
                "G": "만화/웹툰"
            };
            
            let combinedName = `${nameMap[top1]} x ${nameMap[top2]} 융합형 취향`;
            let combinedDesc = `당신의 메인 취향은 [${categoryDetails[top1].name}]이며, 서브 취향으로 [${categoryDetails[top2].name}] 성향도 함께 가지고 계시네요! \n\n${categoryDetails[top1].desc} 더불어 ${categoryDetails[top2].desc.replace("당신은 ", "")} 두 가지 매력을 모두 관통하는 도서들을 선별해 드립니다.`;

            document.getElementById("result-name").innerText = combinedName;
            document.getElementById("result-desc").innerText = combinedDesc;

            const bookListContainer = document.getElementById("book-list");
            bookListContainer.innerHTML = ""; // 🌟 메모리 잔상 제거

            let recommendedBooks = [];
            
            // 🌟 [하이브리드 알고리즘] 1위와 2위의 크로스오버(융합형) 도서 추적
            let fusionPool = [];
            
            // 1위 상자 안에서 2위 태그가 달린 책 탐색
            categoryDetails[top1].books.forEach(b => {
                if (b.crossover === top2) fusionPool.push({ ...b, tag: `${nameMap[top1]} x ${nameMap[top2]} 융합` });
            });
            // 2위 상자 안에서 1위 태그가 달린 책 탐색
            categoryDetails[top2].books.forEach(b => {
                if (b.crossover === top1) fusionPool.push({ ...b, tag: `${nameMap[top1]} x ${nameMap[top2]} 융합` });
            });

            // 융합 도서 풀 셔플
            fusionPool = shuffle(fusionPool);

            // 1. 융합형 도서 최대 2권 우선 장착 (B안)
            let fusionSelected = fusionPool.slice(0, 2);
            fusionSelected.forEach(b => recommendedBooks.push(b));

            // 2. 1위 장르 순수 대중 인기작 1권 강제 매칭 (A안)
            let pureTop1Pool = shuffle([...categoryDetails[top1].books]);
            let pureSelectedBook = null;

            for (let i = 0; i < pureTop1Pool.length; i++) {
                // 이미 뽑힌 융합 책들과 제목이 중복되지 않는 순수 도서 선택
                if (!recommendedBooks.some(rb => rb.title === pureTop1Pool[i].title)) {
                    pureSelectedBook = { ...pureTop1Pool[i], tag: `${nameMap[top1]} 순수 인기작` };
                    break;
                }
            }
            if (pureSelectedBook) recommendedBooks.push(pureSelectedBook);

            // 3. 만약 융합책이 아예 없거나 부족하여 총 3권이 채워지지 않았을 경우용 안전 보완재 (Fallback)
            if (recommendedBooks.length < 3) {
                let pureTop2Pool = shuffle([...categoryDetails[top2].books]);
                for (let i = 0; i < pureTop2Pool.length; i++) {
                    if (recommendedBooks.length >= 3) break;
                    if (!recommendedBooks.some(rb => rb.title === pureTop2Pool[i].title)) {
                        recommendedBooks.push({ ...pureTop2Pool[i], tag: `${nameMap[top2]} 추천` });
                    }
                }
            }

            // 최종 선정된 3권 렌더링
            recommendedBooks.slice(0, 3).forEach(book => {
                const card = document.createElement("div");
                card.className = "book-card";
                card.innerHTML = `
                    <div class="book-tag">${book.tag}</div>
                    <div class="book-title">📖 ${book.title}</div>
                    <div class="book-desc">${book.desc}</div>
                `;
                bookListContainer.appendChild(card);
            });
        }

        function restartTest() {
            document.getElementById("result-screen").classList.remove("active");
            startTest();
        }
    </script>
